name: provers-env-docker

# Builds the provers-env container image (provers-env/docker/Dockerfile.provers) for
# both architectures, each natively on its own runner -- no QEMU, so the arm64 half,
# which compiles Z3 and Verus from source, is not the slow one it is under docker.sh
# on a single host.  The build is docker.sh itself, run once per architecture.
#
# It runs when started by hand, or on a push one of whose commit messages contains
# [docker].  Without 'publish' -- which a push never sets -- it builds and smoke-tests
# the images; with it, it also pushes <image>:<arch>_<version> for both architectures and
# then points <image>:<version> and <image>:latest at a multi-arch manifest of the
# two, as docker.sh does after its prompt.  Publishing needs the DOCKERHUB_USERNAME
# and DOCKERHUB_TOKEN secrets.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push both images and update the <version> and latest manifests'
        type: boolean
        default: false
      build_ver:
        description: 'PROVERS_BUILD_VER override (default: the pin in versions.sh)'
        type: string
        default: ''
      image:
        description: 'PROVERS_IMAGE override (default: the image versions.sh names)'
        type: string
        default: ''
  # every push starts a run, but its jobs are skipped unless one of the pushed
  # commits asks for a build (see 'if' on the build job)
  push:

# a newer build on the same ref replaces one in progress: each holds a runner for an
# hour or more, and only the latest pins are worth building.  A push that does not ask
# for a build gets a group of its own, so that it does not cancel one in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[docker]')) && 'build' || github.run_id }}
  cancel-in-progress: true

env:
  PUBLISH: ${{ inputs.publish }}

jobs:
  # Everything about the build itself -- the image name, the tag, the build args from
  # provers-env/bin/versions.sh, the smoke test, the push and the manifests -- is
  # provers-env/docker/docker.sh; this workflow only chooses where it runs.
  build:
    name: build (${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.message, ' '), '[docker]')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build, smoke-test and (when publishing) push
        # This runner's architecture only, built natively.  An empty override leaves
        # versions.sh's pin in place.
        env:
          PROVERS_ARCHS: ${{ matrix.arch }}
          PROVERS_PUSH: ${{ env.PUBLISH == 'true' && 'true' || 'false' }}
          PROVERS_BUILD_VER: ${{ inputs.build_ver }}
          PROVERS_IMAGE: ${{ inputs.image }}
        run: |
          bash provers-env/docker/docker.sh
          df -h /

  manifest:
    # Only after both architectures have pushed: the manifest names the two tags,
    # wherever they were built.
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish the multi-arch manifests
        env:
          PROVERS_MANIFEST_ONLY: 'true'
          PROVERS_BUILD_VER: ${{ inputs.build_ver }}
          PROVERS_IMAGE: ${{ inputs.image }}
        run: bash provers-env/docker/docker.sh
